<!DOCTYPE html>
<html>
<head>
  <title>Options :: Always Active Plus</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <div class="grid">
    <label for="allSites">Enable on all sites by default (use hostnames as exceptions)</label>
    <input type="checkbox" id="allSites">
    <div class="disabled" style="display: contents;">
      <label for="visibilityState">Overwrite "document.visibilityState"</label>
      <input type="checkbox" id="visibilityState">
      <label for="hidden">Overwrite "document.hidden"</label>
      <input type="checkbox" id="hidden">
    </div>
    <label for="blur">Globally block "blur" events</label>
    <input type="checkbox" id="blur">
    <label for="focus">Globally block "focus" events</label>
    <input type="checkbox" id="focus">
    <label for="visibility">Globally block "visibility" events</label>
    <input type="checkbox" id="visibility">
    <label for="mouseleave">Globally block "mouseleave" and "pointerleave" page-exit events</label>
    <input type="checkbox" id="mouseleave">
    <label for="mouseout">Globally block "mouseout" and "pointerout" page-exit events</label>
    <input type="checkbox" id="mouseout">
    <label for="keyboard">Globally block configured keyboard events</label>
    <input type="checkbox" id="keyboard">
    <label for="pointercapture">Globally block "lostpointercapture" events</label>
    <input type="checkbox" id="pointercapture">
    <div id="redirect-container">
      <label for="redirect">Block JS redirection when page is hidden</label>
      <input type="checkbox" id="redirect">
    </div>
    <label for="log">Display logs (for debugging purpose only)</label>
    <input type="checkbox" id="log">
  </div>
  <h1>Blocked Keyboard Events</h1>
  <p>Comma-separated <code>KeyboardEvent.key</code>, <code>KeyboardEvent.code</code>, or numeric <code>keyCode</code> values.</p>
  <input type="text" id="blockedKeys" placeholder="AltGraph, AltRight, 225">
  <h1>List of Hostnames</h1>
  <p id="host-mode-description"></p>
  <textarea id="hosts" rows="8" placeholder="Hostnames separated by commas. Use the all-sites toggle to choose whether these are inclusions or exceptions. Example:

example.com, *.example.com, www.example.com"></textarea>
  <h1><a data-href="faq6" target="_blank">Policies</a></h1>
  <textarea id="policies" rows="10" placeholder='A JSON object to prevent blocking of some events that conflict with particular hostnames. Example:
{
  "docs.google.com": ["blur", "keyboard"]
}'></textarea>

  <p>
    <input type="button" id="support" value="Project Home">
    <input type="button" id="report" value="Report Bug">
    <input type="button" id="test" value="Test Rules">
  </p>
  <div>
    <input type="button" id="reset" value="Factory Reset">
    <input type="button" id="save" value="Save Options">
    <span id="toast"></span>
  </div>
  <script type="text/javascript" src="index.js"></script>
</body>
</html>
